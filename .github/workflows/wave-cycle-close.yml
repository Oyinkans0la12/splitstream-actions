name: Wave Cycle Close

on:
  schedule:
    # Weekly Wave sprint boundary — adjust to your org's sprint day.
    # Monday 00:00 UTC. Per-cycle config comes from repo variables
    # (CYCLE_POOL_AMOUNT, CYCLE_ID for cycle 0); the on-chain state supplies
    # the window for every cycle after 0.
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      cycle_pool_amount:
        description: "Cycle pool in stroops (string). Ignored on schedule — the schedule uses the CYCLE_POOL_AMOUNT repo variable."
        required: false
      cycle_id:
        description: "Cycle id (string). Required for cycle 0 and dry runs; inferred from on-chain state otherwise."
        required: false
      since:
        description: "Cycle start boundary (ISO 8601). Required for cycle 0 and dry runs."
        required: false
      dry_run:
        description: "Compute manifest + Merkle root only; skip on-chain relay, queries, and the manifest commit."
        type: boolean
        default: false
      commit_manifest:
        description: "Commit the generated manifest to this repo as the audit trail."
        type: boolean
        default: true

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  close-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Close Wave cycle
        id: close
        uses: ./
        with:
          cycle_pool_amount: ${{ github.event_name == 'schedule' && vars.CYCLE_POOL_AMOUNT || inputs.cycle_pool_amount }}
          cycle_id: ${{ github.event_name == 'schedule' && vars.CYCLE_ID || inputs.cycle_id }}
          since: ${{ inputs.since }}
          dry_run: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Relay/oracle keypair — never log it, never commit it, never echo it.
          ORACLE_SECRET_KEY: ${{ secrets.ORACLE_SECRET_KEY }}
          # Optional: a separate funded keypair to fee-bump the relay tx when
          # the oracle account's own XLM balance is a concern.
          FEE_BUMP_SECRET_KEY: ${{ secrets.FEE_BUMP_SECRET_KEY }}

      - name: Commit distribution manifest (audit trail)
        if: steps.close.outputs.dry_run == 'false' && (github.event_name == 'schedule' || inputs.commit_manifest)
        run: |
          git config user.name "splitstream-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifests/
          git commit -m "chore(manifest): record cycle ${{ steps.close.outputs.cycle_id }} distribution manifest" || echo "no manifest changes to commit"
          git push